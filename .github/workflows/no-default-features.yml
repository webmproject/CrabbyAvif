name: No Default Features
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Cancel the workflow if a new one is triggered from the same PR, branch, or tag, except on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  no-default-features:
    name: "No Default Features on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-deps

    - name: Using stable toolchain build the library and run the tests without default features
      run: cargo +stable test --no-default-features -- --skip sharpyuv

    - name: Configure the Rust toolchain and target using rustup
      run: rustup toolchain install stable --target i686-unknown-linux-gnu

    - name: Using stable toolchain build the library without default features for 32-bit target
      if: runner.os == 'Linux'
      run: cargo +stable check --target --target i686-unknown-linux-gnu --no-default-features

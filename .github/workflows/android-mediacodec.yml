name: Build with Android MediaCodec
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Cancel the workflow if a new one is triggered from the same PR, branch, or tag, except on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  no-default-features:
    name: "Build with Android MediaCodec"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # This is needed for faster emulators. See:
    # https://github.com/ReactiveCircus/android-emulator-runner?tab=readme-ov-file#running-hardware-accelerated-emulators-on-linux-runners
    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Download and Setup the Android NDK
      uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
      id: setup-ndk
      with:
        ndk-version: r25c
        add-to-path: false

    - name: Configure the Rust toolchain and target using rustup
      run: rustup toolchain install stable --target x86_64-linux-android

    - name: Build libyuv for Android
      working-directory: ./sys/libyuv-sys
      run: ./libyuv_android.sh ${STEPS_SETUP_NDK_OUTPUTS_NDK_PATH}
      env:
        STEPS_SETUP_NDK_OUTPUTS_NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}

    - name: Build googletest for Android
      working-directory: ./external
      run: ./googletest_android.sh ${STEPS_SETUP_NDK_OUTPUTS_NDK_PATH}
      env:
        STEPS_SETUP_NDK_OUTPUTS_NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}

    - name: Set globals
      id: globals
      run: echo "HEIF_CONFORMANCE_COMMIT_HASH=6ff1e33481d325296d8a787432453ef3fa91f591" >> "${GITHUB_OUTPUT}"

    - name: Cache heif_conformance conformance_files
      id: cache-heif-conformance-files
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: external/heif_conformance/conformance_files
        key: cache-heif-conformance-files-${{ steps.globals.outputs.HEIF_CONFORMANCE_COMMIT_HASH }}

    - name: Clone heif_conformance (HEIF conformance files)
      if: steps.cache-heif-conformance-files.outputs.cache-hit != 'true'
      working-directory: ./external
      run: |
        git clone https://github.com/nokiatech/heif_conformance.git
        cd heif_conformance
        git checkout ${STEPS_GLOBALS_OUTPUTS_HEIF_CONFORMANCE_COMMIT_HASH}
      env:
        STEPS_GLOBALS_OUTPUTS_HEIF_CONFORMANCE_COMMIT_HASH: ${{ steps.globals.outputs.HEIF_CONFORMANCE_COMMIT_HASH }}

    - name: Install cargo dinghy
      run: cargo install cargo-dinghy --force

    - name: Install cargo ndk
      run: cargo install cargo-ndk --force

    - name: Run the tests on an emulator
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        script: |
          # Push the HEIF conformance files on to the emulator.
          adb shell mkdir -p /data/local/tmp/heif_conformance
          adb push external/heif_conformance/conformance_files /data/local/tmp/heif_conformance/

          # Run the rust tests (including the HEIC conformance tests). The AVIF
          # conformance tests are skipped since they need dav1d.
          cargo dinghy -p auto-android-x86_64-latest -d android -e CRABBYAVIF_HEIC_CONFORMANCE_TEST_DATA_DIR=/data/local/tmp/heif_conformance test --no-default-features --features android_mediacodec,heic,libyuv --target x86_64-linux-android -- --skip test_conformance

          # Build the library with C API enabled.
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          cargo ndk -t x86_64-linux-android build --no-default-features --features capi,heic,android_mediacodec,libyuv --release

          # Build the tests with C API enabled.
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake -DANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }} -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-33 -DANDROID_STL=c++_static -S c_api_tests -B c_build_android
          make -C c_build_android decoder_tests sk_crabby_avif_codec_tests

          # Push the test binaries on to the emulator.
          adb push c_build_android/decoder_tests /data/local/tmp
          adb push c_build_android/sk_crabby_avif_codec_tests /data/local/tmp

          # Run the tests (the test data has already been copied by dinghy when
          # running the rust tests).
          adb shell /data/local/tmp/decoder_tests /data/local/tmp/dinghy/crabby-avif/tests/data/
          adb shell /data/local/tmp/sk_crabby_avif_codec_tests /data/local/tmp/dinghy/crabby-avif/tests/data/

        api-level: 34
        force-avd-creation: false
        arch: x86_64
        ndk: 25.2.9519653

